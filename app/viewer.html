.cl{display:flex;align-items:center;gap:7px;font:12.5px var(--sans);padding:2px 0;cursor:pointer}.cl span{margin-left:auto;color:var(--faint)}
.cl i{width:10px;height:10px;border-radius:0;flex:0 0 10px}
.pick{font-size:12.5px}.pick b{font:600 13px var(--sans)}.pick .k{color:var(--mute);font:11.5px var(--sans)}

.cl{min-width:0}.cl .ln{margin-left:0;color:inherit;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cl .ln+span{flex:0 0 auto}
.pick .ut{margin-top:4px;font:11.5px var(--sans);color:var(--ink)} .pick .ut div{display:flex;gap:6px} .pick .ut .k{min-width:62px}
body.cm #c{cursor:crosshair}

#cmb.on{background:var(--copper);border-color:var(--copper);color:#fff}
.cc{border:1px solid var(--line);border-left:3px solid #c23b2e;background:#fff;padding:6px 8px;margin-bottom:6px;cursor:pointer;font:12.5px/1.4 var(--sans)}
.cc.sent{border-left-color:#4b7f52;opacity:.75} .cc .m{font:11px var(--sans);color:var(--faint);display:flex;gap:6px;margin-bottom:2px;min-width:0}

.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 13px;font:12.5px var(--sans);opacity:0;transition:.25s;z-index:9;pointer-events:none}.toast.show{opacity:1}
#info{display:none} #c{touch-action:none}
@media(max-width:600px){

}

    g.fillStyle=getComputedStyle(p).backgroundColor;g.fillRect(x-w/2,y-h-5*sx,w,h);g.beginPath();g.moveTo(x-4*sx,y-5*sx);g.lineTo(x+4*sx,y-5*sx);g.lineTo(x,y);g.fill();g.fillStyle="#fff";g.fillText(p.textContent,x,y-h/2-5*sx)});
  return o.toDataURL("image/png")}
function closeBox(){document.querySelectorAll(".cbox").forEach(x=>x.remove());if(draft){draft=null;pins()}}
function startComment(h,e){const n=h.object.userData.el;select(n);closeBox();
  draft={point:v3(h.point),name:n.name||"",cls:n.userData.cls||"",layer:n.userData.layer||"",type:n.userData.type||"",guid:n.userData.guid||"",tag:n.userData.tag||"",user:n.userData.user||null};
  pins();editBox(draft,true,e.clientX,e.clientY)}
function editBox(it,isNew,x,y){document.querySelectorAll(".cbox").forEach(b=>b.remove());const b=document.createElement("div");b.className="cbox";
  const pl=innerWidth>600?$(".panel").getBoundingClientRect().left-8:innerWidth;b.style.left=(x+14+280<=pl?x+14:Math.max(8,x-14-280))+"px";b.style.top=Math.min(innerHeight-170,Math.max(8,y-20))+"px";
  b.innerHTML=`<div class="el">${esc(it.name||"element")} <span>${esc(it.layer||it.cls||"")}</span></div><textarea placeholder="what is wrong here?">${esc(it.text||"")}</textarea><div class="r"><span class="h">#${it.n||"new"} · ⌘↵ save</span>${isNew?"":'<button data-a="del">delete</button>'}<button data-a="cancel">cancel</button><button class="go" data-a="save">save</button></div>`;
  b.addEventListener("pointerdown",ev=>ev.stopPropagation());document.body.appendChild(b);const ta=b.querySelector("textarea");ta.focus();
  const done=async a=>{b.remove();if(a==="save"){if(isNew){draft=null;const shot=snapWith(it);await capi("add",{...it,text:ta.value.trim(),camera:{pos:v3(C.position),target:v3(O.target)},mpoint:modelPt(new THREE.Vector3(...it.point)),shot})}
      else await capi("update",{id:it.id,text:ta.value.trim()})}
    else if(a==="del")await capi("delete",{id:it.id}); else {draft=null;pins()}};
  b.querySelectorAll("button").forEach(x=>x.onclick=()=>done(x.dataset.a));
  ta.addEventListener("keydown",ev=>{ev.stopPropagation();if(ev.key==="Enter"&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();done("save")}if(ev.key==="Escape"){ev.preventDefault();done("cancel")}})}
function snapWith(it){const keep=draft;draft={...it,n:Math.max(0,...CM.items.map(i=>i.n))+1};const u=snap(1400);draft=keep;return u}
async function cload(){if(!FILE){clist();return}try{CM=await (await fetch("/api/comments3d?p="+encodeURIComponent(FILE))).json()}catch(e){CM={items:[]}}clist()}
async function capi(op,item){if(!FILE){toast("comments need the file path");return}
  try{const r=await fetch("/api/comments3d",{method:"POST",body:JSON.stringify({path:FILE,op,item})});const d=await r.json();if(d&&d.items)CM=d;else if(op==="add")CM.items.push({...item,id:Date.now(),n:CM.items.length+1,state:"open"})}catch(e){toast("could not save")}
  clist()}
function clist(){const open=CM.items.filter(i=>i.state!=="sent").length;$("#ccn").textContent=CM.items.length?` (${open})`:"";
  $("#csend").disabled=!open;$("#csend").textContent=open?`send ${open} to {{COORD}}`:"nothing new to send";$("#cfoot").style.display=CM.items.length?"flex":"none";
  $("#clist").innerHTML=CM.items.length?CM.items.slice().sort((a,b)=>a.n-b.n).map(i=>`<div class="cc ${i.state==="sent"?"sent":""}" data-id="${i.id}"><div class="m"><b>#${i.n}</b><span class="en">${esc(i.name||"element")}${i.state==="sent"?" · sent":""}</span><span class="x" data-del="${i.id}" title="delete">✕</span></div>${esc(i.text)||'<i style="color:#aaa">no comment</i>'}</div>`).join("")
    :`<div class="cempty">${FILE?"press ✎ comment (C), then click an element.":"open the model from Officina to comment."}</div>`;
  document.querySelectorAll(".cc").forEach(c=>c.onclick=e=>{const id=+c.dataset.id;if(e.target.dataset.del){capi("delete",{id});return}const i=CM.items.find(x=>x.id===id);if(!i)return;
    const ns=findEl([i.guid||i.name].filter(Boolean));hilite(ns);if(ns[0])select(ns[0]);flyTo(i.camera,ns);const p=document.querySelector(`.pin[data-id="${id}"]`);if(p){p.classList.add("hot");setTimeout(()=>p.classList.remove("hot"),1400)}});
  pins()}
const pv=new THREE.Vector3();
function pins(){const box_=$("#pins"),list=CM.items.concat(draft?[{...draft,id:"d",n:draft.n||"·",state:"new"}]:[]),r=R.domElement.getBoundingClientRect();
  if(box_.childElementCount!==list.length)box_.innerHTML=list.map(i=>`<div class="pin ${i.state==="sent"?"sent":i.state==="new"?"new":""}" data-id="${i.id}" title="${esc(i.text||"")}">${i.n}</div>`).join("");
  [...box_.children].forEach((el,k)=>{const i=list[k];if(!i||!i.point){el.style.display="none";return}pv.set(...i.point).project(C);
    if(pv.z>1||pv.x<-1.05||pv.x>1.05||pv.y<-1.05||pv.y>1.05){el.style.display="none";return}
    el.style.display="";el.style.left=((pv.x+1)/2*r.width)+"px";el.style.top=((1-pv.y)/2*r.height)+"px";el.textContent=i.n;el.className="pin "+(i.state==="sent"?"sent":i.state==="new"?"new":"")})}
$("#pins").addEventListener("click",e=>{const p=e.target.closest(".pin");if(!p||p.dataset.id==="d")return;const i=CM.items.find(x=>x.id===+p.dataset.id);if(i){const r=p.getBoundingClientRect();editBox(i,false,r.right,r.top)}});
$("#csend").onclick=async()=>{const r=await fetch("/api/comments3d/send",{method:"POST",body:JSON.stringify({path:FILE,note:$("#cnote").value.trim(),snapshot:snap(1800)})});
  if(r.ok){const d=await r.json();$("#cnote").value="";toast(`sent ${d.count||""} comment(s) to {{COORD}}`);await cload()}else toast("could not send")};
addEventListener("keydown",e=>{if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="c"||e.key==="C"){setCM(!cmode)} else if(e.key==="Escape"&&cmode){setCM(false)} else if(e.key==="f"){look("iso")}});
(function loop(){requestAnimationFrame(loop);O.update();R.render(S,C);if(CM.items.length||draft)pins()})();
</script>
